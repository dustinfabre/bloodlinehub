<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#14243a">
        <title>BloodlineHub is offline</title>
        <style>
            :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
            * { box-sizing: border-box; }
            body { min-height: 100vh; min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8f6f0; color: #14243a; }
            main { width: min(100%, 420px); text-align: center; }
            .mark { display: block; width: 112px; height: 112px; margin: 0 auto 24px; }
            h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0; }
            p { margin: 0 0 24px; line-height: 1.6; color: #64748b; }
            button { min-height: 44px; border: 0; border-radius: 8px; padding: 0 20px; background: #14243a; color: #ffffff; font: inherit; font-weight: 700; cursor: pointer; }
            button:focus-visible { outline: 3px solid #d4af62; outline-offset: 2px; }
        </style>
    </head>
    <body>
        <main>
            <img class="mark" src="/icons/logo.webp" alt="" width="112" height="112">
            <h1>You are offline</h1>
            <p>BloodlineHub needs a connection to load records or save changes. Reconnect and try again.</p>
            <button type="button" onclick="window.location.reload()">Try again</button>
        </main>
    </body>
</html>
